syntax = "proto3";

package astra.v1;

option go_package = "github.com/arnav/astra/services/backend/internal/pb";

// Client -> server envelope. Exactly one StreamStart per connection,
// then AudioFrames in seq order, then an optional StreamStop.
message ClientMessage {
  oneof msg {
    StreamStart stream_start = 1;
    AudioFrame audio_frame = 2;
    StreamStop stream_stop = 3;
  }
}

// Declares the audio format for the Stream. The server accepts exactly
// 16000 Hz / 1 channel / 16-bit signed LE PCM / 20 ms frames and rejects
// anything else — fields exist for validation, not negotiation.
message StreamStart {
  uint32 sample_rate_hz = 1;
  uint32 channels = 2;
  uint32 bits_per_sample = 3;
  uint32 frame_duration_ms = 4;
}

// One Frame of PCM audio. pcm must be exactly 640 bytes
// (320 samples of s16le at 16 kHz = 20 ms).
message AudioFrame {
  uint64 seq = 1; // starts at 0, increments by 1 per frame
  bytes pcm = 2;
}

message StreamStop {}

// Server -> client envelope. StreamStarted is sent once; the reply messages
// stream per turn. Every reply message carries the utterance_id it belongs to
// (the utterance's first frame seq) so a client can discard audio from a turn
// it has already cancelled.
message ServerMessage {
  oneof msg {
    StreamStarted stream_started = 1;
    Error error = 2;
    Transcript transcript = 3;
    ReplyDelta reply_delta = 4;
    ReplyAudio reply_audio = 5;
    ReplyEnd reply_end = 6;
    Cancel cancel = 7;
  }
}

message StreamStarted {
  string stream_id = 1;
}

// Sent once on any protocol violation; the connection closes after.
message Error {
  string code = 1;
  string message = 2;
}

// What the user said, once the utterance closed and ASR returned.
message Transcript {
  uint64 utterance_id = 1; // seq of the utterance's first frame
  string text = 2;
}

// One chunk of the assistant's reply text, as the LLM streams it. Display
// only — the audio path is independent and may lag behind.
message ReplyDelta {
  uint64 utterance_id = 1;
  string text = 2;
}

// One chunk of synthesized reply audio: mono s16le. seq starts at 0 per turn.
//
// Unlike the inbound AudioFrame this is NOT pinned to 16 kHz. The server only
// forwards reply audio — nothing server-side analyses it — so pinning the rate
// would mean writing a resampler purely to satisfy a constant. The TTS
// provider's rate is carried here instead and the client resamples on
// playback, which the Web Audio API does natively.
message ReplyAudio {
  uint64 utterance_id = 1;
  uint64 seq = 2;
  bytes pcm = 3;
  uint32 sample_rate_hz = 4;
}

// Discard any buffered audio for this turn NOW. Sent on barge-in, ahead of
// ReplyEnd: stopping the server from sending is not the same as stopping the
// client from playing what it already holds, and the client-side flush is what
// the user actually perceives as the interruption.
message Cancel {
  uint64 utterance_id = 1;
}

// Terminates a turn. Exactly one per turn that produced any reply.
message ReplyEnd {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    DONE = 1;       // the reply finished on its own
    BARGED_IN = 2;  // the user talked over it; a Cancel preceded this
    ERROR = 3;      // LLM or TTS failed; the stream survives
  }
  uint64 utterance_id = 1;
  Reason reason = 2;
}
